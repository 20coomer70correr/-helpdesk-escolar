
services:
  web:
    build: .
    container_name: helpdesk_web
    ports:
      - "8080:80"
    environment:
      DB_HOST: mysql
      DB_NAME: helpdesk
      DB_USER: helpdesk_user
      DB_PASSWORD: helpdesk123
    depends_on:
      - mysql
    networks:
      - helpdesk_network

  mysql:
    image: mysql:8.0
    container_name: helpdesk_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: helpdesk
      MYSQL_USER: helpdesk_user
      MYSQL_PASSWORD: helpdesk123
    volumes:
      - mysql_data:/var/lib/mysql
      - ./banco/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - helpdesk_network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: helpdesk_phpmyadmin
    ports:
      - "8081:80"
    environment:
      PMA_HOST: mysql
    depends_on:
      - mysql
    networks:
      - helpdesk_network

networks:
  helpdesk_network:
    driver: bridge

volumes:
  mysql_data:
